# =============================================================================
# .github/workflows/eval.yml
# ASU LLM Evaluation — CI/CD Quality Gate Workflow
#
# Triggers on every push to main/master, on pull requests targeting them, and
# manually (with an optional full 100-question run).
#
#   1. Offline unit tests  (free, no secrets) — fail fast on code bugs
#   2. RAGAS evaluation    (paid API calls)   — PASS / FAIL / ERROR
#   3. Report artifact + run summary page
#   4. On main/master only: commit results so the Vercel dashboard updates
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY, PINECONE_API_KEY
# =============================================================================

name: LLM Evaluation Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

  # Allow manual runs from the Actions tab with an optional full-run toggle
  workflow_dispatch:
    inputs:
      full_run:
        description: "Evaluate all 100 questions instead of the 10-question test sample"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel any in-progress run for the same branch so pushes don't queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: RAGAS Quality Gates
    runs-on: ubuntu-latest

    # contents: write is required for the final "Commit evaluation results" step
    # to push results back to the repository using GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Python setup + dependencies ────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Unit tests (offline, free) ─────────────────────────────────────
      - name: Run unit tests
        run: pytest

      # ── 4. Validate required secrets ──────────────────────────────────────
      #    Secrets are passed through env (never interpolated into the script).
      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          MISSING=0
          for NAME in OPENAI_API_KEY PINECONE_API_KEY; do
            if [ -z "${!NAME}" ]; then
              echo "ERROR: $NAME secret is not configured."
              MISSING=1
            else
              echo "$NAME : configured."
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Add missing secrets at:"
            echo "  GitHub repo -> Settings -> Secrets and variables -> Actions"
            echo "(Pull requests from forks never receive repository secrets.)"
            exit 1
          fi

      # ── 5. Run evaluation ─────────────────────────────────────────────────
      #    Exit 0 = all gates PASS → CI green
      #    Exit 1 = gates FAIL, or ERROR (pipeline could not run) → CI red
      - name: Run LLM evaluation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          EVAL_FULL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.full_run == 'true' }}
          PYTHONUNBUFFERED: "1"
        run: python src/run_eval.py

      # ── 6. Upload evaluation report ───────────────────────────────────────
      #    if: always() ensures artifact is uploaded even when gates fail.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-report-${{ github.run_number }}
          path: results/latest_report.json
          if-no-files-found: warn
          retention-days: 30

      # ── 7. Gate summary → Actions log + run summary page ──────────────────
      - name: Print gate summary
        if: always()
        run: python src/report_summary.py

      # ── 8. Commit evaluation results back to the repo ─────────────────────
      #    Only for runs on main/master itself — pull request results must not
      #    overwrite the dashboard (and a PR checkout has no branch to push to).
      #    [skip ci] in the commit message prevents an infinite CI trigger loop.
      #    The rebase picks up commits pushed while the evaluation was running.
      - name: Commit evaluation results
        if: >-
          always()
          && github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          && hashFiles('results/latest_report.json') != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest_report.json results/eval_history.json
          if git diff --staged --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "ci: update evaluation results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
