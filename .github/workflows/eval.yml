# =============================================================================
# .github/workflows/eval.yml
# ASU LLM Evaluation — CI/CD Quality Gate Workflow
#
# Triggers on every push to main/master and on pull requests targeting main.
# Runs the full RAGAS evaluation pipeline and PASSES or FAILS the CI check
# based on whether all quality gates are satisfied.
#
# Required repository secret:
#   OPENAI_API_KEY  — set at Settings > Secrets and variables > Actions
#
# Artifacts:
#   latest_report.json is uploaded so you can download it from the Actions UI.
# =============================================================================

name: LLM Evaluation Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

  # Allow manual runs from the Actions tab with an optional full-run toggle
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run full 100-question evaluation instead of TEST_MODE (10 Qs)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel any in-progress run for the same branch so pushes don't queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: RAGAS Quality Gates
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Validate required secret ───────────────────────────────────────
      #    Fail early with a clear message instead of a cryptic API error
      #    if the OPENAI_API_KEY secret has not been added to the repository.
      - name: Check OPENAI_API_KEY secret
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ERROR: OPENAI_API_KEY secret is not configured."
            echo ""
            echo "Please add it at:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            echo "  Name:  OPENAI_API_KEY"
            echo "  Value: sk-..."
            exit 1
          fi
          echo "OPENAI_API_KEY is configured."

      # ── 3. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Write .env from secrets ────────────────────────────────────────
      - name: Create .env file
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      # ── 6. Ensure results/ directory exists ───────────────────────────────
      - name: Create results directory
        run: mkdir -p results

      # ── 7. (Optional) Override TEST_MODE for manual full runs ─────────────
      - name: Enable full run mode (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_run == 'true' }}
        run: |
          sed -i 's/^TEST_MODE = True/TEST_MODE = False/' src/run_eval.py
          echo "TEST_MODE set to False — running full 100-question evaluation."

      # ── 8. Run evaluation ─────────────────────────────────────────────────
      #    Exit 0 = all gates PASS → CI green
      #    Exit 1 = one or more gates FAIL → CI red, deployment blocked
      - name: Run LLM evaluation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python src/run_eval.py

      # ── 9. Upload evaluation report ───────────────────────────────────────
      #    if: always() ensures artifact is uploaded even when gates fail.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-report-${{ github.run_number }}
          path: results/latest_report.json
          if-no-files-found: warn
          retention-days: 30

      # ── 10. Print gate summary to Actions log ─────────────────────────────
      - name: Print gate summary
        if: always()
        run: |
          if [ -f results/latest_report.json ]; then
            echo "============================================"
            echo "EVALUATION SUMMARY"
            echo "============================================"
            python - <<'EOF'
          import json
          with open("results/latest_report.json") as f:
              r = json.load(f)
          m = r.get("metrics", {})
          print(f"  Questions : {r.get('total_questions')} ({'TEST MODE' if r.get('test_mode') else 'FULL RUN'})")
          print(f"  Commit    : {r.get('commit_id')}")
          print(f"  Judge     : gpt-4o-mini")
          print()
          print(f"  Hallucination Rate  : {m.get('hallucination_rate', 'N/A')}")
          print(f"  Answer Relevancy    : {m.get('answer_relevancy', 'N/A')}")
          print(f"  Faithfulness        : {m.get('faithfulness', 'N/A')}")
          print(f"  Context Precision   : {m.get('context_precision', 'N/A')}")
          print(f"  Latency P95         : {m.get('latency_p95_seconds', 'N/A')}s")
          print(f"  Cost Per Query      : ${m.get('cost_per_query_usd', 0):.4f}")
          print()
          overall = r.get("overall_result", "UNKNOWN")
          failed  = r.get("failed_gates", [])
          print(f"  OVERALL: {overall}")
          if failed:
              print(f"  FAILED : {', '.join(failed)}")
          else:
              print("  All gates passed.")
          print("============================================")
          EOF
          else
            echo "No report file — evaluation errored before saving results."
            echo "Most likely cause: OPENAI_API_KEY secret not set in repository."
          fi
